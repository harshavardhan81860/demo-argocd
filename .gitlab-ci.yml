stages:
  - build
  - test
  - security
  - deploy
  - notify
  
image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  IMAGE_TAG: $CI_COMMIT_REF_NAME
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""


# ---------------- BUILD ----------------
build_backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG backend/
    - docker push $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG

build_frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
  script:
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG frontend/
    - docker push $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG

# ---------------- TEST ----------------
test_backend:
  stage: test
  image: node:20
  cache:
    key: backend-deps
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install
    - npm run test || echo "No tests found, skipping..."

test_frontend:
  stage: test
  image: node:20
  cache:
    key: frontend-deps
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm install
    - npm run lint || echo "No lint script, skipping"
    - npm run test || echo "No tests found, skipping..."

# ---------------- SECURITY ----------------
dependency_scan:
  stage: security
  image: node:20
  cache:
    key: backend-deps
    policy: pull
  script:
    - cd backend
    - npm audit --audit-level=high || true

container_scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG

# ---------------- DEPLOY ----------------
deploy_backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "harsha81860@gmail.com"
    - git config --global user.name "harshavardhan81860"
    - git remote set-url origin https://oauth2:aQIBXp87iS7T1K_FfngOXWM6MQpvOjEKdTptZXUydg8.01.170e05n0u@gitlab.com/harshavardhan81860/harsha.git
  script:
    - IMAGE_PATH="$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    - git add backend-deployment.yaml
    - git commit -m "deploy backend $IMAGE_TAG [skip ci]" || echo "No changes"
    - git push origin HEAD:$CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preprod" || $CI_COMMIT_BRANCH == "prod"'
      changes:
        - backend/**/*
        - backend-deployment.yaml

deploy_frontend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "harsha81860@gmail.com"
    - git config --global user.name "harshavardhan81860"
    - git remote set-url origin https://oauth2:aQIBXp87iS7T1K_FfngOXWM6MQpvOjEKdTptZXUydg8.01.170e05n0u@gitlab.com/harshavardhan81860/harsha.git
  script:
    - IMAGE_PATH="$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
    - git add frontend-deployment.yaml
    - git commit -m "deploy frontend $IMAGE_TAG [skip ci]" || echo "No changes"
    - git push origin HEAD:$CI_COMMIT_BRANCH
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preprod" || $CI_COMMIT_BRANCH == "prod"'
      changes:
        - frontend/**/*
        - frontend-deployment.yaml

# ---------------- NOTIFY ----------------
notify:
  stage: notify
  image: alpine:latest
  script:
    - echo "Deployment triggered. ArgoCD will sync automatically."