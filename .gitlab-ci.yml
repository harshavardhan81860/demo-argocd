stages:
  - build
  - test
  - security
  - deploy
  - notify
  
image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  IMAGE_TAG: $CI_COMMIT_REF_NAME
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

before_script:
  - docker info
  - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin


# ---------------- BUILD ----------------
build_backend:
  stage: build
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG backend/
    - docker push $CI_REGISTRY_IMAGE/backend:$IMAGE_TAG

build_frontend:
  stage: build
  script:
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG frontend/
    - docker push $CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG

# ---------------- TEST ----------------
test_backend:
  stage: test
  image: node:20
  cache:
    key: backend-deps
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install
    - npm test

test_frontend:
  stage: test
  image: node:20
  cache:
    key: frontend-deps
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm install
    - npm run lint
    - npm test

# ---------------- SECURITY ----------------
dependency_scan:
  stage: security
  image: node:20
  cache:
    key: backend-deps
    policy: pull
  script:
    - cd backend
    - npm audit --audit-level=high || true

container_scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image my-app-image:latest

# ---------------- DEPLOY ----------------
deploy_backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "harsha81860@gmail.com"
    - git config --global user.name "harshavardhan81860"
    # Replace GIT_PUSH_TOKEN with your actual Masked Variable in GitLab Settings
    - git remote set-url origin https://oauth2:aQIBXp87iS7T1K_FfngOXWM6MQpvOjEKdTptZXUydg8.01.170e05n0u@gitlab.com/harshavardhan81860/harsha.git
  script:
    - echo "Updating backend image tag to $IMAGE_TAG"
    - IMAGE_FULL_PATH="$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    
    # Verify the deployment file actually exists
    - |
      if [ ! -f "backend-deployment.yaml" ]; then
        echo "ERROR: backend-deployment.yaml not found!"
        exit 1
      fi

    # Perform the update
    - sed -i "s|image:.*backend.*|image: ${IMAGE_FULL_PATH}|g" backend-deployment.yaml

    # Validation and Git Push
    - |
      if grep -q "${IMAGE_FULL_PATH}" backend-deployment.yaml; then
        echo "SUCCESS: Manifest updated to ${IMAGE_FULL_PATH}"
        git add backend-deployment.yaml
        # [skip ci] prevents infinite pipeline loops
        if git commit -m "chore(deploy): update backend to $IMAGE_TAG [skip ci]"; then
          git push origin HEAD:$CI_COMMIT_BRANCH
        else
          echo "No changes to commit"
        fi
      else
        echo "ERROR: Failed to update manifest."
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preprod" || $CI_COMMIT_BRANCH == "prod"'
      changes:
        - backend/**/*
        - backend-deployment.yaml

deploy_frontend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "harsha81860@gmail.com"
    - git config --global user.name "harshavardhan81860"
    - git remote set-url origin https://oauth2:aQIBXp87iS7T1K_FfngOXWM6MQpvOjEKdTptZXUydg8.01.170e05n0u@gitlab.com/harshavardhan81860/harsha.git
  script:
    - echo "Updating frontend image tag to $IMAGE_TAG"
    - IMAGE_FULL_PATH="$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
    
    - |
      if [ ! -f "frontend-deployment.yaml" ]; then
        echo "ERROR: frontend-deployment.yaml not found!"
        exit 1
      fi

    - sed -i "s|image:.*frontend.*|image: ${IMAGE_FULL_PATH}|g" frontend-deployment.yaml

    - |
      if grep -q "${IMAGE_FULL_PATH}" frontend-deployment.yaml; then
        echo "SUCCESS: Manifest updated"
        git add frontend-deployment.yaml
        if git commit -m "chore(deploy): update frontend to $IMAGE_TAG [skip ci]"; then
          git push origin HEAD:$CI_COMMIT_BRANCH
        else
          echo "No changes to commit"
        fi
      else
        echo "ERROR: Failed to update manifest."
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preprod" || $CI_COMMIT_BRANCH == "prod"'
      changes:
        - frontend/**/*
        - frontend-deployment.yaml

# ---------------- NOTIFY ----------------
notify:
  stage: notify
  image: alpine:latest
  script:
    - echo "Deployment triggered. ArgoCD will sync automatically."