apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: registry.gitlab.com/harshavardhan81860/harsha/frontend:dev
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: gitlab-registry-secret